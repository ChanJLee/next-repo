name: Strategy Check

# 美股交易时段（UTC）：
#   夏令时（3-11 月）：13:30–20:00 UTC = 9:30–16:00 ET
#   冬令时（11-3 月）：14:30–21:00 UTC = 9:30–16:00 ET
# 覆盖两者并留 30 min 缓冲；Vercel 函数内的 isMarketOpen() 再做一次过滤
on:
  schedule:
    - cron: "*/30 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "忽略市场开闭时段强制评估"
        type: boolean
        default: false

concurrency:
  group: strategy-check
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger /api/cron/check on Vercel
        env:
          CRON_URL: ${{ secrets.CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          if [ -z "$CRON_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::missing CRON_URL or CRON_SECRET secret"
            exit 1
          fi
          QUERY=""
          if [ "$FORCE" = "true" ]; then QUERY="?force=1"; fi
          URL="${CRON_URL}/api/cron/check${QUERY}"
          echo "calling ${URL}"
          # 不用 -f：让我们能在非 2xx 时拿到响应体与状态码，便于区分
          # “应用层 401（{\"error\":\"unauthorized\"}，CRON_SECRET 不匹配）” 与
          # “Vercel Deployment Protection 拦截（返回 SSO HTML）”。
          BODY=$(mktemp)
          CODE=$(curl -sS --max-time 240 -X POST \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -o "$BODY" -w "%{http_code}" \
            "${URL}")
          echo "HTTP ${CODE}"
          echo "----- response body -----"
          cat "$BODY"; echo ""
          echo "-------------------------"
          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
            if [ "$CODE" = "401" ] && grep -qi "Authentication Required\|_vercel_sso\|vercel.com/sso" "$BODY"; then
              echo "::error::401 来自 Vercel Deployment Protection（平台 SSO），请求未到达函数。请在 Vercel 项目 Settings → Deployment Protection 关闭对生产环境的保护，或配置 Protection Bypass for Automation 并在请求里带 bypass token。"
            elif [ "$CODE" = "401" ]; then
              echo "::error::401 来自应用（CRON_SECRET 不匹配）。请确认 GitHub Secret 的 CRON_SECRET 与 Vercel 环境变量 CRON_SECRET 完全一致，且改动后已重新部署。"
            else
              echo "::error::请求失败，HTTP ${CODE}（详见上方响应体）"
            fi
            exit 1
          fi
