name: Strategy Check

# 美股交易时段（UTC）：
#   夏令时（3-11 月）：13:30–20:00 UTC = 9:30–16:00 ET
#   冬令时（11-3 月）：14:30–21:00 UTC = 9:30–16:00 ET
# 覆盖两者并留 30 min 缓冲；Vercel 函数内的 isMarketOpen() 再做一次过滤
on:
  schedule:
    - cron: "*/30 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "忽略市场开闭时段强制评估"
        type: boolean
        default: false

concurrency:
  group: strategy-check
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger /api/cron/check on Vercel
        env:
          CRON_URL: ${{ secrets.CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          if [ -z "$CRON_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::missing CRON_URL or CRON_SECRET secret"
            exit 1
          fi
          QUERY=""
          if [ "$FORCE" = "true" ]; then QUERY="?force=1"; fi
          echo "calling ${CRON_URL}/api/cron/check${QUERY}"
          curl -fsSL --max-time 240 -X POST \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            "${CRON_URL}/api/cron/check${QUERY}"
          echo ""
