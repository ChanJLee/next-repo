name: Model Calibration Monitor

# 周度跑校准监控：连生产 Turso 重算走查特征 → 评样本外 Brier/skill/ECE。
# skill ≤ 0（跑不赢"永远报基准率"）时 --gate 让任务失败，作为模型漂移告警。
# 报告 data/calibration-report.json 作为 artifact 上传，便于回看历史趋势。
on:
  schedule:
    - cron: "40 13 * * 1" # 每周一 13:40 UTC（一周交易数据落定后）
  workflow_dispatch:
    inputs:
      points:
        description: "每标的最多取样点数（越大越准越慢）"
        default: "1000"
      step:
        description: "取样步长（越大越快）"
        default: "3"

concurrency:
  group: model-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      POINTS: ${{ github.event.inputs.points || '1000' }}
      STEP: ${{ github.event.inputs.step || '3' }}
    steps:
      - name: Guard secrets
        run: |
          if [ -z "$TURSO_DATABASE_URL" ]; then
            echo "::error::缺少 TURSO_DATABASE_URL（+ 通常还需 TURSO_AUTH_TOKEN）secret，无法连生产库重算特征"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Featurize (walk-forward, point-in-time)
        run: |
          mkdir -p data
          echo "featurize: points=${POINTS} step=${STEP}"
          pnpm exec tsx scripts/featurize.ts "${POINTS}" "${STEP}" 400

      - name: Monitor calibration (gate on skill<=0)
        run: pnpm model:monitor --gate

      - name: Upload calibration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibration-report
          path: data/calibration-report.json
          if-no-files-found: warn
